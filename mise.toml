[tools]
ninja = "1.11.1"
pipx = "1.8.0" # required by conan and meson
conan = "2.25.2"
meson = "1.10.1"

# --- building ---

# building
[tasks.build]
depends = ["compile-meson"]

# meson build system
[tasks.compile-meson]
hide = true
run = "meson compile -C meson/build"
depends = ["build-meson"]

[tasks.build-meson]
hide = true
run = """
meson setup --native-file conan/build/conan_meson_native.ini meson/build --reconfigure 2>/dev/null \
  || meson setup --native-file conan/build/conan_meson_native.ini meson/build
ln -sf meson/build/compile_commands.json compile_commands.json
"""
depends = ["build-conan"]

# conan dependency management
[tasks.build-conan]
hide = true
run = "conan install . -sbuild_type=Debug -s compiler.cppstd=23 -of=conan/build --build=missing -pr=conan/profile"

# conan setup script
[tasks.setup-conan]
hide = true
# detect compiler and generate a repo-local conan profile
run = """
echo 'mise manages dependencies using python3-venv, it might be required to install it first'
PROFILE_NAME=_project_detect
if command -v clang++ &>/dev/null; then
echo "Detected clang++, selecting clang as preferred compiler"
CC=clang CXX=clang++ conan profile detect --force --name "$PROFILE_NAME"
else
echo ""
echo "WARNING: clang++ not found. clang is the preferred compiler for this project"
echo "  (clangd LSP works best with clang compile commands)."
echo "  Install clang to get the best experience, e.g.: sudo apt install clang"
echo ""
read -p "Continue setup with gcc? [Y/n] " choice
case "$choice" in
n|N) echo "Setup aborted."; exit 1 ;;
esac
conan profile detect --force --name "$PROFILE_NAME"
fi
mv "$(conan config home)/profiles/$PROFILE_NAME" conan/profile
echo "Conan profile written to conan/profile"
"""

[tasks.setup]
depends = ["setup-conan"]

# --- running ---
[tasks.dev]
description = "Compile and run (debug)"
run = """
meson compile -C meson/build
./meson/build/cpp-game
"""

# --- formatting ---
[tasks.format]
description = "Format codebase with clang-format"
run = "clang-format -i $(git ls-files '*.cpp' '*.h')"

[tasks.format-check]
description = "Check codebase with clang-format"
run = "clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')"
